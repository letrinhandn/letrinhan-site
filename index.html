<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Lê Trí Nhân / Le Tri Nhan: research and writing on economics, political economy, and public policy."
    />
    <meta name="theme-color" content="#5e0b15" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('letrinhan-site-theme')
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
          }
          document.documentElement.dataset.theme = t
        } catch (e) {
          document.documentElement.dataset.theme = 'dark'
        }

        /* Production gate — full site only on localhost */
        var host = location.hostname
        if (host !== 'localhost' && host !== '127.0.0.1') {
          document.documentElement.classList.add('is-gated')
        }
      })()
    </script>
    <style>
      html.is-gated,
      html.is-gated body {
        overflow: hidden !important;
      }
      html.is-gated #root {
        filter: blur(18px) saturate(0.7);
        pointer-events: none !important;
        user-select: none !important;
      }
      html.is-gated::before {
        content: '';
        position: fixed;
        inset: 0;
        z-index: 2147483646;
        background: rgba(20, 4, 6, 0.55);
        pointer-events: auto;
      }
      html.is-gated::after {
        content: 'hiding from the internet';
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        margin: 0;
        padding: 1.5rem;
        font-family: 'Be Vietnam Pro', system-ui, sans-serif;
        font-size: clamp(0.95rem, 2.8vw, 1.15rem);
        font-weight: 500;
        letter-spacing: 0.04em;
        color: #f2e8e4;
        text-align: center;
        pointer-events: none;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <title>Le Tri Nhan</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
